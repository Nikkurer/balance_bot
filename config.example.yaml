telegram:
  bot_token: "YOUR_BOT_TOKEN"
  allowed_user_ids:
    - 123456789

# Каталог с плагинами (файлы .py или пакеты); в Docker задаётся через compose
plugins_dir: plugins
# Часовая зона бота (IANA): используется в сообщениях и timestamp логов
timezone: UTC

# История баланса (SQLite); retention_days/max_size_mb: 0 = не применять
# history:
#   enabled: true
#   path: data/balance_bot.db
#   retention_days: 365
#   max_size_mb: 32
#   record_errors: false        # сбои — в poll_errors, не в balance_history
#   chart_points_per_day: 4     # 0 — все точки; иначе усреднение при избытке за сутки
#   chart_max_points: 10000     # 0 — без лимита; иначе последние N точек для /chart
#   prune_interval_hours: 24    # 0 — prune только при старте и после /refresh

services:
  # Документация: docs/plugins/vdsina.md, docs/plugins/aeza.md, docs/plugins/cloud.md, docs/plugins/mock.md
  # --- VDSina: один плагин, два аккаунта (ru / com) — разные api_token ---
  - name: "vdsina-ru"
    plugin: vdsina
    poll_interval_seconds: 3600
    balance_threshold: 500.0
    subscription_warn_days: 7
    plugin_config:
      api_token: "YOUR_VDSINA_RU_API_TOKEN"
      site: ru
      currency: RUB
      balance_field: real   # real | bonus | partner | total

  - name: "vdsina-com"
    plugin: vdsina
    poll_interval_seconds: 3600
    balance_threshold: 10.0
    subscription_warn_days: 7
    plugin_config:
      api_token: "YOUR_VDSINA_COM_API_TOKEN"
      site: com
      currency: USD
      balance_field: real

  - name: "aeza-net"
    plugin: aeza
    poll_interval_seconds: 3600
    balance_threshold: 100.0
    subscription_warn_days: 7
    plugin_config:
      api_token: "YOUR_AEZA_NET_API_TOKEN"
      site: net
      currency: RUB
      # auth: bearer              # по умолчанию для core.aeza.net

  - name: "aeza-ru"
    plugin: aeza
    poll_interval_seconds: 3600
    balance_threshold: 100.0
    subscription_warn_days: 7
    plugin_config:
      api_token: "YOUR_AEZA_RU_API_TOKEN"
      site: ru
      currency: RUB
      # auth: api_key             # по умолчанию для my.aeza.ru

  - name: "cloud-main"
    plugin: cloud
    poll_interval_seconds: 3600
    balance_threshold: 500.0
    subscription_warn_days: 7
    plugin_config:
      key_id: "YOUR_CLOUD_KEY_ID"
      key_secret: "YOUR_CLOUD_KEY_SECRET"
      agreement_id: "YOUR_AGREEMENT_UUID"
      currency: RUB
      # auth: key              # key | bearer | api_key

  # --- тестовый плагин без API ---
  - name: "demo-service"
    plugin: mock
    poll_interval_seconds: 300
    balance_threshold: 100.0
    subscription_warn_days: 7
    plugin_config:
      balance: 50.0
      currency: RUB
      subscription_end: "2026-06-01T00:00:00+00:00"

telegram:
  bot_token: "YOUR_BOT_TOKEN"
  allowed_user_ids:
    - 123456789

# Каталог с плагинами (файлы .py или пакеты); в Docker задаётся через compose
plugins_dir: plugins

services:
  # Документация: plugins/vdsina.md, plugins/aeza.md, plugins/cloud.md, plugins/mock.md
  # --- VDSina: один плагин, два аккаунта (ru / com) — разные api_token ---
  - name: "vdsina-ru"
    plugin: vdsina
    poll_interval_seconds: 3600
    balance_threshold: 500.0
    subscription_warn_days: 7
    plugin_config:
      api_token: "YOUR_VDSINA_RU_API_TOKEN"
      site: ru
      currency: RUB
      balance_field: real   # real | bonus | partner | total

  - name: "vdsina-com"
    plugin: vdsina
    poll_interval_seconds: 3600
    balance_threshold: 10.0
    subscription_warn_days: 7
    plugin_config:
      api_token: "YOUR_VDSINA_COM_API_TOKEN"
      site: com
      currency: USD
      balance_field: real

  - name: "aeza-net"
    plugin: aeza
    poll_interval_seconds: 3600
    balance_threshold: 100.0
    subscription_warn_days: 7
    plugin_config:
      api_token: "YOUR_AEZA_NET_API_TOKEN"
      site: net
      currency: RUB
      # auth: bearer              # по умолчанию для core.aeza.net

  - name: "aeza-ru"
    plugin: aeza
    poll_interval_seconds: 3600
    balance_threshold: 100.0
    subscription_warn_days: 7
    plugin_config:
      api_token: "YOUR_AEZA_RU_API_TOKEN"
      site: ru
      currency: RUB
      # auth: api_key             # по умолчанию для my.aeza.ru

  - name: "cloud-main"
    plugin: cloud
    poll_interval_seconds: 3600
    balance_threshold: 500.0
    subscription_warn_days: 7
    plugin_config:
      key_id: "YOUR_CLOUD_KEY_ID"
      key_secret: "YOUR_CLOUD_KEY_SECRET"
      agreement_id: "YOUR_AGREEMENT_UUID"
      # customer_id: "YOUR_CUSTOMER_UUID"
      currency: RUB
      balance_field: balance
      # auth: key              # key | bearer | api_key
      # balance_path: "v1/agreements/{agreement_id}/balance"

  # --- тестовый плагин без API ---
  - name: "demo-service"
    plugin: mock
    poll_interval_seconds: 300
    balance_threshold: 100.0
    subscription_warn_days: 7
    plugin_config:
      balance: 50.0
      currency: RUB
      subscription_end: "2026-06-01T00:00:00+00:00"

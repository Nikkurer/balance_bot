[project]
name = "balance-bot"
version = "0.1.0"
description = "Telegram-бот для отслеживания баланса и срока подписки на сервисах"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "aiohttp>=3.9,<4",
    "matplotlib>=3.8,<4",
    "pyyaml>=6.0,<7",
]

[project.scripts]
balance-bot = "balance_bot.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["balance_bot"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
